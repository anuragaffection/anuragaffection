<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" role="img" aria-label="Anurag: Developer × Educator. MERN, Go, Java, DSA, AWS, Flutter. सीखना और सिखाना — learn, and teach.">
<style>
